name: Mutation Testing

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  incremental-mutants:
    name: Incremental Mutants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
        - 127.0.0.1:5432:5432
        options: --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Compute diff against base branch
      run: |
        git diff origin/${{ github.base_ref }}.. | tee git.diff
    - name: Install Rust
      uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3
      with:
        toolchain: stable
    - name: Install cargo-mutants
      uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c
      with:
        tool: cargo-mutants
    - name: Run mutants on the diff
      env:
        DATABASE_URL: postgresql://postgres@127.0.0.1/postgres?connect_timeout=5
      run: |
        set +e
        cargo mutants --jobs 1 --jobserver-tasks 4 --no-shuffle -vV --in-diff git.diff \
          --features diesel-sqlite,diesel-postgres -- -- --include-ignored
        code=$?
        set -e
        # Exit codes other than success (0), missed (2), and timeout (3) are
        # hard failures such as a bad invocation or a failing baseline build.
        if [ "$code" -ne 0 ] && [ "$code" -ne 2 ] && [ "$code" -ne 3 ]; then
          echo "cargo-mutants failed with exit code $code"
          exit "$code"
        fi
        # Fail only on surviving mutants. Timeouts are intrinsic to stateful
        # iterators (a mutated state update makes a consumer loop forever) and
        # are not real test gaps, so a timeout-only run is allowed to pass.
        if [ -s mutants.out/missed.txt ]; then
          echo "Surviving mutants found:"
          cat mutants.out/missed.txt
          exit 1
        fi
    - name: Archive mutants results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: mutants-incremental.out
        path: mutants.out
